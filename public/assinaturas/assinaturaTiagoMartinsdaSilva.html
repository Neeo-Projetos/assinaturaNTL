<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Modern Animated Email Signature</title>
    <!-- Note: Tailwind CDN is used here for demonstration. For email clients, inline CSS is recommended. -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class", // Changed to class for manual control if needed, but we default to light
            theme: {
                extend: {
                    colors: {
                        primary: "#E89132",
                        "slate-blue": "#728CA1",
                        "dark-blue": "#0f172a",
                        "background-light": "#ffffff",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    animation: {
                        'draw-line': 'drawLine 1s ease-out forwards',
                        'slide-in-left': 'slideInLeft 0.8s ease-out forwards',
                        'spin-pause': 'spinPause 3s cubic-bezier(0.4, 0, 0.2, 1) infinite',
                    },
                    keyframes: {
                        drawLine: {
                            '0%': { height: '0', opacity: '0' },
                            '100%': { height: '100%', opacity: '1' },
                        },
                        slideInLeft: {
                            '0%': { opacity: '0', transform: 'translateX(-20px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        },
                        spinPause: {
                            '0%': { transform: 'rotate(0deg)' },
                            '33%': { transform: 'rotate(360deg)' },
                            '100%': { transform: 'rotate(360deg)' },
                        }
                    }
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            width: 587px;
            height: 140px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
        }

        .signature-container {
            width: 587px;
            height: 140px;
            box-sizing: border-box;
            background-color: #ffffff;
            /* Default light */
            padding: 12px 24px;
        }
    </style>
</head>

                Tiago Martins da Silva

            <div class="space-y-0">

            <div class="flex flex-col gap-0 pt-1">
                <a class="text-blue-700 hover:text-blue-800 font-medium text-sm transition-colors border-b border-transparent hover:border-blue-700 w-fit leading-snug"
                    href="mailto:tiago.mds@live.com">
                    tiago.mds@live.com

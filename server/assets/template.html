<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>Assinatura NTL</title>
</head>

<body style="margin:0;padding:0;background:#ffffff;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0"
    style="border-collapse:separate;border-spacing:0;width:536px;max-width:536px;font-family:Arial,Helvetica,sans-serif;color:#1f2937;mso-table-lspace:0pt;mso-table-rspace:0pt;">
    <tr>
      <td style="padding:12px 0;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"
          style="border-collapse:separate;border-spacing:0;width:100%;">
          <tr>
            <td style="padding:0;border:1px solid #dfe4ea;border-radius:28px;background:#ffffff;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0"
                style="border-collapse:separate;border-spacing:0;width:100%;">
                <tr>
                  <td valign="top"
                    style="width:304px;padding:24px 26px 22px 26px;border-radius:28px 0 0 28px;background:#ffffff;">
                    <div style="margin:0 0 10px 0;font-size:26px;line-height:1.08;font-weight:700;color:#0f172a;">
                      {{NAME}}</div>
                    <div style="margin:0 0 18px 0;font-size:15px;line-height:1.5;color:#667085;">{{ROLE}}</div>
                    <div style="font-size:14px;line-height:22px;color:#1f2937;">{{CONTACT_BLOCK}}</div>
                  </td>
                  <td style="width:1px;background:#e7ebf0;font-size:0;line-height:0;">&nbsp;</td>
                  <td align="center" valign="middle"
                    style="width:182px;padding:10px 8px 10px 8px;border-radius:0 28px 28px 0;background:#ffffff;">
                    <img src="{{GIF_URL}}" width="170" alt="NTL Nova Tecnologia"
                      style="display:block;width:170px;max-width:170px;height:auto;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;" />
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
